<!-- Colours follow the app theme (src/ui/theme/Tokens.h): ink #111111, paper #f4f4f4, accent #ffd60a -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="4" y="4" width="120" height="120" rx="22" fill="#111111"/>
  <!-- four steps of a pattern; the accented one is yellow -->
  <g fill="#f4f4f4">
    <rect x="20" y="70" width="18" height="34" rx="3"/>
    <rect x="44" y="52" width="18" height="52" rx="3"/>
    <rect x="68" y="80" width="18" height="24" rx="3"/>
  </g>
  <rect x="92" y="24" width="18" height="80" rx="3" fill="#ffd60a"/>
</svg>
