name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: scripts/install-deps-ubuntu.sh

      # Dependency archives (JUCE, Catch2): keyed on the file that pins their versions and hashes.
      - uses: actions/cache@v6
        with:
          path: .cache/deps
          key: deps-${{ hashFiles('cmake/TeknoDependencies.cmake') }}

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Configure, build, test (warnings are errors, window tests under Xvfb)
        run: xvfb-run -a cmake --workflow --preset ci

      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-snapshots
          path: build/ci/snapshots/*.png
          if-no-files-found: ignore
